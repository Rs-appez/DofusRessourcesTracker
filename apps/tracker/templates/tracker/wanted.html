{% extends 'layout.html' %}
{% load static %}
{% block title %}Wanted{% endblock %}
{% block extra_css %}
    <link href="{% static 'tracker/css/wanted-detail.css' %}" rel="stylesheet" />
    <link href="{% static 'tracker/css/resource-list.css' %}" rel="stylesheet" />
    <link href="{% static 'tracker/css/wanted.css' %}" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'tracker/css/modal.css' %}" />
{% endblock %}
{% block extra_js %}
    <script src="{% static 'tracker/js/value-modal.js' %}" defer></script>
    <script src="{% static 'tracker/js/sell-modal.js' %}" defer></script>
    <script src="{% static 'tracker/js/wanted-detail.js' %}" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
{% endblock %}
{% block content %}
    <div class="wanted-page-container">
        <div class="wanted-list-container">{% include 'tracker/partials/wanted-list.html' %}</div>
        <div class="wanted-detail-container">{% include 'tracker/partials/wanted-detail.html' %}</div>
        <div class="wanted-list-container"></div>
    </div>
{% endblock %}
