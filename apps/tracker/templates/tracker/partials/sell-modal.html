<dialog id="sellDialog" class="cardDialog" closedby="any">
    <div class="dialog-content">
        <h2>Enter the sell value for :</h2>
        <h3>{{ resource.name }}</h3>
        <form hx-post="{% url 'tracker:add_sell_value' resource.id %}"
              hx-target="#sell_values"
              class="modal-form"
              id="sellForm">
            {% csrf_token %} {{ formSell }}
            <input type="submit" value="Submit" />
        </form>
    </div>
</dialog>
