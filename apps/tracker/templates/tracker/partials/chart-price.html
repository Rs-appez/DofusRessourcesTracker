<canvas id="priceChart-{{ id }}"></canvas>
<script type="application/json" id="chart_data_{{ id }}">{{ datas|safe }}</script>
<script type="application/json" id="chart_labels_{{ id }}">{{ labels|safe }}</script>
<script type="application/json" id="chart_cards_{{ id }}">{{ cards|safe }}</script>
<script>
    function initChart() {

        let ctx = document.getElementById("priceChart-{{ id }}").getContext("2d");
        let labels = JSON.parse(document.getElementById('chart_labels_{{ id }}').textContent);
        let data = JSON.parse(document.getElementById('chart_data_{{ id }}').textContent);
        let cardsData = JSON.parse(document.getElementById('chart_cards_{{ id }}').textContent);

    new Chart(ctx, {
        type: "line",
        data: {
            labels: labels,
            datasets: [
                {
                    label: "Resource price",
                    data: data,
                    borderColor: "rgba(75, 192, 192, 1)",
                    backgroundColor: "rgba(75, 192, 192, 0.2)",
                    tension: 0.1,
                    spanGaps: true,
                },
                    {
                    label: "All cards price",
                    data: cardsData,
                    borderColor: "rgba(153, 102, 255, 1)",
                    backgroundColor: "rgba(153, 102, 255, 0.2)",
                    tension: 0.1,
                    spanGaps: true,
                    },
            ],
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    position: "right",
                },
                title: {
                    display: false,
                },
            },
        },
    });
  };
    initChart();
</script>
