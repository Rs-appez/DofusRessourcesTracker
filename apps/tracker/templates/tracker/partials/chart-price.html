<div id="chart-container-{{ id }}"></div>
<script type="application/json" id="chart_data_{{ id }}">{{ datas|safe }}</script>
<script type="application/json" id="chart_labels_{{ id }}">{{ labels|safe }}</script>
<script type="application/json" id="chart_cards_{{ id }}">{{ cards|safe }}</script>
<script type="application/json" id="chart_sells_{{ id }}">{{ sells|safe }}</script>
<script>
    function initChart() {

        const canvasId = "priceChart-{{ id }}";
        const containerId = "chart-container-{{ id }}";

        const container = document.getElementById(containerId);
        const canvas = document.createElement('canvas');

        canvas.id = canvasId;
        container.appendChild(canvas);
        
        const ctx = canvas.getContext("2d");
        const labels = JSON.parse(document.getElementById('chart_labels_{{ id }}').textContent);
        const data = JSON.parse(document.getElementById('chart_data_{{ id }}').textContent);
        const cardsData = JSON.parse(document.getElementById('chart_cards_{{ id }}').textContent);
        const sellsData = JSON.parse(document.getElementById('chart_sells_{{ id }}').textContent);

    new Chart(ctx, {
        type: "line",
        data: {
            labels: labels,
            datasets: [
                {
                    label: "Resource price",
                    data: data,
                    borderColor: "rgba(75, 192, 192, 1)",
                    backgroundColor: "rgba(75, 192, 192, 0.2)",
                    tension: 0.1,
                    spanGaps: true,
                },
                {
                    label: "All cards price",
                    data: cardsData,
                    borderColor: "rgba(153, 102, 255, 1)",
                    backgroundColor: "rgba(153, 102, 255, 0.2)",
                    tension: 0.1,
                    spanGaps: true,
                },
                {
                    label: "Average sales price",
                    data: sellsData,
                    borderColor: "rgba(255, 159, 64, 1)",
                    backgroundColor: "rgba(255, 159, 64, 0.2)",
                    tension: 0.1,
                    pointRadius: 5,
                },
            ],
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: {
                duration: 150,
                easing: 'easeOutQuad',
            },
            plugins: {
                legend: {
                    position: "right",
                },
                title: {
                    display: false,
                },
            },
        },
    });
  };
    initChart();
</script>
